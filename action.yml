name: "Setup Fortran Compilers"
description: Set up Fortran compilers on GitHub Actions runners
author: fortran-lang
branding:
  icon: cpu
  color: purple

inputs:
  compiler:
    description: >-
      Fortran compiler to install. Canonical names are `gfortran`, `ifx`,
      `ifort`, `nvfortran`, `aocc`, `lfortran`, `flang`, and `armflang`.
      Compatibility aliases `gcc`, `intel`, `intel-classic`, and `nvidia-hpc`
      are also accepted, but canonical names are recommended. Defaults to
      `gfortran`.
    required: false
    default: gfortran
  version:
    description: >-
      Compiler version to install. Enclose the version string in quotation marks
      (e.g. `"2026.1.1"` or `"0.64.0"`). Defaults to the latest version.
    required: false
  msystem:
    description: >-
      Windows toolchain environment to use. Defaults to `native`. Ignored on
      non-Windows runners.
    required: false
    default: native
  cleanup-disk:
    description: >-
      Free up disk space by removing large pre-installed toolkits. Currently
      only supported for `nvfortran` installations. Defaults to `false`.
    required: false
    default: "false"
  update-environment:
    description: >-
      Whether to export toolchain environment variables (FC, CC, CXX, FPM_*,
      F77, F90, FORTRAN_COMPILER) to the runner environment. Accepts `true` or
      `false`. Defaults to `true`.
    required: false
    default: "true"

outputs:
  version:
    description: The installed compiler version.
  fc:
    description: The Fortran compiler command or path.
  cc:
    description: The C compiler command or path.
  cxx:
    description: The C++ compiler command or path.

runs:
  using: node24
  main: dist/index.js
