name: lfortran

on:
  workflow_call:

permissions:
  actions: read
  contents: read

jobs:
  integration-tests:
    name: ${{ matrix.toolchain.version }} ${{ matrix.image }} ${{
      matrix.toolchain.msystem }}
    if: github.actor != 'dependabot[bot]'
    runs-on: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image:
          [
            ubuntu-24.04,
            ubuntu-22.04,
            macos-26,
            macos-26-intel,
            macos-15,
            macos-15-intel,
            macos-14,
            windows-2025,
            windows-2022,
          ]
        toolchain:
          - { compiler: lfortran, version: "0.64.0" }
          - { compiler: lfortran, version: "0.63.0" }
          - { compiler: lfortran, version: "0.62.0" }
          - { compiler: lfortran, version: "0.61.0" }
          - { compiler: lfortran, version: "0.60.0" }
          - { compiler: lfortran, version: "0.59.0" }
          - { compiler: lfortran, version: "0.58.0" }
          - { compiler: lfortran, version: "0.57.0" }
        include:
          - image: windows-2025
            toolchain: { compiler: lfortran, msystem: ucrt64 } # only latest version available from Pacman
          - image: windows-2022
            toolchain: { compiler: lfortran, msystem: ucrt64 } # only latest version available from Pacman
          - image: windows-2025
            toolchain: { compiler: lfortran, msystem: clang64 } # only latest version available from Pacman
          - image: windows-2022
            toolchain: { compiler: lfortran, msystem: clang64 } # only latest version available from Pacman
    steps:
      - uses: actions/checkout@v7

      - name: Restore dist-verify
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: gh run download ${{ github.run_id }} --name generated-dist-verify --dir dist-verify
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Restore dist-tests
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: gh run download ${{ github.run_id }} --name generated-dist-tests --dir dist-tests
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install ${{ matrix.toolchain.compiler }} ${{ matrix.toolchain.version }}
        id: setup
        uses: ./
        with:
          compiler: ${{ matrix.toolchain.compiler }}
          version: ${{ matrix.toolchain.version }}
          msystem: ${{ matrix.toolchain.msystem }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify installation
        env:
          OUTPUT_VERSION: ${{ steps.setup.outputs.version }}
          OUTPUT_FC: ${{ steps.setup.outputs.fc }}
          OUTPUT_CC: ${{ steps.setup.outputs.cc }}
          OUTPUT_CXX: ${{ steps.setup.outputs.cxx }}
        run: |
          npm run verify-installation
          echo "Fortran Compiler Setup:"
          echo "  Version: ${{ steps.setup.outputs.version }}"
          echo "  FC:      ${{ steps.setup.outputs.fc }}"
          echo "  CC:      ${{ steps.setup.outputs.cc }}"
          echo "  CXX:     ${{ steps.setup.outputs.cxx }}"

      - name: Verify compiler invocation under pwsh/cmd (Windows only)
        if: runner.os == 'Windows'
        uses: ./.github/actions/verify-windows-shells
        with:
          fc: ${{ steps.setup.outputs.fc }}
          cc: ${{ steps.setup.outputs.cc }}
          cxx: ${{ steps.setup.outputs.cxx }}

      - name: Verify compile and link under bash (Windows native only)
        if: runner.os == 'Windows' && matrix.toolchain.msystem == ''
        shell: bash
        run: |
          printf 'program smoke\n  print *, "linked from bash"\nend program smoke\n' > smoke.f90
          "$FC" smoke.f90 -o smoke.exe
          ./smoke.exe

      - name: Run Integration Tests
        run: npm run integration-test
