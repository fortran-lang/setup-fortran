name: Test mixed
description: Test building and linking Fortran with C and C++ code
runs:
  using: "composite"
  steps:

    - name: Build and run (bash)
      shell: bash
      run: |
        echo "FC=${{ env.FC }} CC=${{ env.CC }} CXX=${{ env.CXX }}"
        cmake -S test/mixed -B "$RUNNER_TEMP/mixed" -G Ninja
        cmake --build "$RUNNER_TEMP/mixed"
        output=$("$RUNNER_TEMP/mixed/mixed.exe")
        echo "$output"
        [[ "$output" == *"mixed result 5 20"* ]] || (echo "Unexpected mixed program output: $output"; exit 1)
